openapi: 3.0.3
info:
  title: Servizio verifica identità CIE / TS-CNS / Passaporto / EMV
  description: >
    Servizio locale (127.0.0.1) che legge tramite NFC documenti d'identità elettronici
    (CIE, TS-CNS, passaporto, carte d'identità estere biometriche come la CNIe francese),
    carte di pagamento contactless (EMV) e tag NFC generici. Restituisce dati anagrafici in
    JSON con uno schema uniforme, un checksum HMAC e un `tokenCarta` stabile per il riconoscimento.
  version: "1.0.0"
servers:
  - url: http://127.0.0.1:8765
    description: Istanza locale

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
  schemas:
    Errore:
      type: object
      properties:
        errore: { type: string }
      example: { errore: "API key non valida" }

    Health:
      type: object
      properties:
        status: { type: string, example: UP }

    Lettore:
      type: object
      properties:
        index: { type: integer, example: 0 }
        name: { type: string, example: "BIT4ID miniLector AIR" }
        cardPresent: { type: boolean }
    ReaderList:
      type: object
      properties:
        readers:
          type: array
          items: { $ref: '#/components/schemas/Lettore' }

    StatoLettore:
      type: object
      properties:
        reader: { type: string, nullable: true }
        cardPresent: { type: boolean }
        tipo:
          type: string
          nullable: true
          description: Tipo carta rilevato senza leggerne i dati
          enum: [TS-CNS, CIE, "Carta di credito", NFC, sconosciuta, null]

    CheckRequest:
      type: object
      description: >
        Chiave di accesso secondo il documento. CIE/carta francese: `can`.
        Passaporto/ID estero via MRZ: `documentNumber`+`dateOfBirth`+`dateOfExpiry`.
        TS-CNS e carte EMV: nessuna chiave.
      properties:
        can:
          type: string
          description: CAN (6 cifre stampate sulla carta) per CIE / carta francese
          example: "123456"
        documentNumber:
          type: string
          description: Numero documento dalla MRZ (passaporto)
        dateOfBirth:
          type: string
          description: Data di nascita, AAMMGG o AAAA-MM-GG
        dateOfExpiry:
          type: string
          description: Data di scadenza, AAMMGG o AAAA-MM-GG
        foto:
          type: boolean
          default: false
          description: Se true legge anche la foto (DG2) e la firma (DG7)
        debug:
          type: boolean
          default: false
          description: Diagnostica (eMRTD/EMV); ignorato se la console è disabilitata
        reader:
          type: string
          description: Selettore lettore (indice "0"/"1" o parte del nome); default il primo con carta

    Documento:
      type: object
      description: >
        Risposta uniforme. I campi compaiono solo se disponibili per quel documento.
        I campi di luogo e `tipo` sono in MAIUSCOLO. `additionalProperties` è true perché
        l'insieme dei campi varia per tipo documento.
      additionalProperties: true
      properties:
        tipo:
          type: string
          description: >
            CIE | TS-CNS | PASSAPORTO | "CARTA D'IDENTITA <PAESE>" | "Carta di credito" | NFC |
            "IDENTITÀ UNITA" (risultato del flow a 2 documenti /identity/*). Per la categoria
            normalizzata usare `categoriaDocumento`; per il tipo MRZ usare `tipoDocumento`.
        cognome: { type: string }
        nome: { type: string }
        nomeCompleto: { type: string }
        codiceFiscale:
          type: string
          description: >
            Identificativo fiscale ITA. CERTIFICATO se da CIE/TS (`codiceFiscaleCertified:true`),
            altrimenti CALCOLATO dal passaporto (`codiceFiscaleCertified:false` +
            `codiceFiscaleDaVerificare:true`). Nell'identità unita prevale sempre quello certificato
            della TS e i marcatori "calcolato/da verificare" vengono rimossi.
        codiceFiscaleCertified:
          type: boolean
          description: true se letto dal documento (CIE/TS), false se calcolato (passaporto)
        codiceFiscaleCalcolato:
          type: string
          description: CF calcolato dai dati del passaporto (presente solo se non certificato)
        codiceFiscaleDaVerificare:
          type: boolean
          description: true quando il CF è calcolato e va confermato (es. leggendo la TS)
        codiceFiscaleNota: { type: string }
        sesso: { type: string, enum: [M, F] }
        dataNascita: { type: string, format: date }
        luogoNascita:
          type: string
          description: >
            Luogo di nascita CANONICO e leggibile, SEMPRE valorizzato quando il dato esiste: dal
            documento (MRZ/DG11) se presente, altrimenti sintetizzato come "COMUNE (PROV)" dai campi
            strutturati (TS-CNS) o come Stato estero. Mappare QUI il luogo di nascita nel CRM.
        comuneNascita: { type: string, description: Comune (strutturato) — solo nati in Italia }
        provinciaNascita: { type: string, description: Sigla provincia — solo nati in Italia }
        regione: { type: string }
        statoNascita: { type: string, description: Stato estero — solo nati all'estero }
        natoEstero: { type: boolean }
        codiceCatastale: { type: string, description: Codice Belfiore (de-omocodato) }
        cittadinanza: { type: string }
        numeroDocumento: { type: string }
        categoriaDocumento: { type: string, description: "categoria normalizzata: passaporto | carta d'identità" }
        paese: { type: string, description: Paese emittente (nome esteso, MAIUSCOLO) }
        unioneEuropea: { type: boolean }
        statoEmissione: { type: string, description: ISO-3166 alpha-3 (es. ITA, FRA) }
        tipoDocumento: { type: string, description: codice tipo da MRZ (es. P, ID) }
        dataScadenza: { type: string, format: date }
        dataEmissione: { type: string, format: date }
        autoritaEmittente: { type: string }
        indirizzo: { type: string }
        numeroNazionale:
          type: string
          description: >
            Identificativo nazionale per documenti esteri (es. CNP rumeno, RNTRC ucraino, NID
            albanese). Per i documenti ITA l'identificativo è `codiceFiscale`.
        numeroPersonale: { type: string, description: numero personale grezzo da DG11 (se non è un CF) }
        statura: { type: string, description: altezza in cm (solo TS-CNS) }
        riassuntoPersonale: { type: string }
        custodia: { type: string }
        altriDocumenti: { type: string }
        telefono: { type: string }
        professione: { type: string }
        chiaveAnagrafica: { type: string, description: HMAC pseudonimo del CF }
        # --- immagini (solo con foto:true) ---
        fotoBase64: { type: string, description: "data URL (PNG se convertibile)" }
        fotoFormato: { type: string, enum: [png, originale] }
        fotoMimeOriginale: { type: string }
        fotoLarghezza: { type: string }
        fotoAltezza: { type: string }
        firmaBase64: { type: string, description: Firma autografa (DG7) come data URL }
        # --- struttura/chip eMRTD ---
        dataGroupPresenti: { type: string, example: "[1, 2, 11, 12, 14, 15]" }
        versioneLDS: { type: string }
        chipAuthentication: { type: boolean }
        activeAuthentication: { type: boolean }
        idChip: { type: string, description: Hash della chiave AA (DG15), stabile per chip }
        idDocumento: { type: string, description: HMAC della firma SOD, stabile per documento }
        algoritmoHashSOD: { type: string }
        notaChip: { type: string, description: nota sui data group assenti/protetti del chip }
        dg13Presente: { type: boolean }
        dg13Testo: { type: string, description: testo stampabile estratto dal DG13 (dati nazionali) }
        nomiTraslitterati: { type: boolean, description: nomi resi in caratteri latini (cirillico/greco) }
        # --- flow identità a 2 documenti (/identity/*): TS-CNS + passaporto/CIE ---
        corrispondenza:
          type: boolean
          description: >
            Presente SOLO nell'IDENTITÀ UNITA. true se le due carte sono della stessa persona
            (match su cognome+nome e, se disponibile, data di nascita). Il CF è informativo, non
            entra nel verdetto (il CF calcolato non risolve l'omocodia).
        matchDettaglio: { type: string, description: dettaglio match per campo (cognome/nome/nascita/sesso/CF) }
        documentoPrincipale: { type: string, description: "tipo del documento con foto da cui vengono i campi di radice (es. Passaporto, CIE)" }
        documentiUniti: { type: string, example: "Passaporto + TS-CNS" }
        tesseraSanitaria:
          type: object
          additionalProperties: true
          description: >
            SOLO nell'IDENTITÀ UNITA. Dati SECONDARI della Tessera Sanitaria (NON il documento
            principale): codice fiscale certificato, comune/provincia di nascita, codice emettitore,
            statura, ecc. I campi di radice (anagrafica, date, riferimenti) vengono invece dal
            documento con foto. Stessi nomi-campo di una lettura TS-CNS singola.
        # --- carta di pagamento EMV ---
        numeroCarta: { type: string, description: PAN in chiaro (perimetro PCI-DSS) }
        scadenza: { type: string, example: "12/2028" }
        circuito: { type: string, example: VISA }
        aid: { type: string }
        panSequence: { type: string }
        titolare: { type: string }
        ttqUsato: { type: string }
        # --- identificatore uniforme per i tornelli ---
        tokenCarta: { type: string, description: HMAC stabile pseudonimo per il riconoscimento }
        tokenCartaFonte:
          type: string
          enum: [cf, pan, sod, chip, numeroDocumento, uid]
        uidCasuale:
          type: boolean
          description: true se l'UID è casuale (token NON stabile)
        uidCarta: { type: string }
        # --- metadati/firma ---
        letturaTimestamp: { type: string, format: date-time }
        nonce: { type: string }
        checksum: { type: string, description: HMAC-SHA256 di tutti i campi precedenti }
        # --- esiti d'errore possibili ---
        errore: { type: string }
        canErrato: { type: boolean }
        messaggio: { type: string }

    IdentifyResponse:
      type: object
      properties:
        tipo: { type: string, nullable: true }
        tokenCarta:
          type: string
          nullable: true
          description: null per eID senza CAN/MRZ o se nessuna fonte stabile
        tokenCartaFonte: { type: string, enum: [cf, pan, uid] }
        uidCasuale: { type: boolean }
        avviso: { type: string }
        richiedeAutenticazione:
          type: boolean
          description: true per CIE/passaporto (serve CAN/MRZ, non identificabili in preflight)
      example:
        tipo: "Carta di credito"
        tokenCarta: "3bc35bde4f300c02fbcd29df5ea9ea04aa0a13ef571ebce95f1466412e2f5737"
        tokenCartaFonte: pan

    WriteRequest:
      type: object
      description: "Scrittura tag NFC: testo NDEF, oppure hex+page/block, oppure record tessera socio."
      properties:
        text: { type: string }
        hex: { type: string }
        page: { type: integer }
        block: { type: integer }
        key: { type: string }
        chiaveAnagrafica: { type: string }
        codiceSocio: { type: string }
        codiceFamiliare: { type: string }
        familiari: { type: string }
        reader: { type: string }

    VerifyRequest:
      type: object
      description: Tutti i campi della risposta da verificare, incluso checksum.
      additionalProperties: true
      required: [checksum]
      properties:
        checksum: { type: string }
    VerifyResponse:
      type: object
      properties:
        valido: { type: boolean }
        nonceConosciuto: { type: boolean }
        checksumAtteso: { type: string }

paths:
  /actuator/health:
    get:
      summary: Liveness
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/Health' } } }

  /actuator/status:
    get:
      summary: Stato del lettore (senza leggere i dati)
      parameters:
        - { name: reader, in: query, required: false, schema: { type: string } }
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/StatoLettore' } } }

  /actuator/readers:
    get:
      summary: Elenco lettori PC/SC collegati
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/ReaderList' } } }

  /check:
    post:
      summary: Legge la carta e restituisce i dati
      security: [ { ApiKeyAuth: [] } ]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CheckRequest' }
            examples:
              cie: { summary: CIE/carta francese, value: { can: "123456", foto: true } }
              passaporto: { summary: Passaporto, value: { documentNumber: "YA1234567", dateOfBirth: "850314", dateOfExpiry: "300620", foto: true } }
              tsCnsEmv: { summary: TS-CNS o carta EMV, value: {} }
      responses:
        '200':
          description: Dati del documento (o errore applicativo nel corpo)
          content: { application/json: { schema: { $ref: '#/components/schemas/Documento' } } }
        '401':
          description: API key non valida
          content: { application/json: { schema: { $ref: '#/components/schemas/Errore' } } }

  /identify:
    get:
      summary: Preflight tornello — solo tokenCarta, senza CAN/MRZ
      security: [ { ApiKeyAuth: [] } ]
      parameters:
        - { name: reader, in: query, required: false, schema: { type: string } }
        - { name: apikey, in: query, required: false, schema: { type: string }, description: alternativa all'header X-API-Key }
      responses:
        '200':
          description: Identificazione (token assente per eID senza chiave)
          content: { application/json: { schema: { $ref: '#/components/schemas/IdentifyResponse' } } }
        '401':
          description: API key non valida
          content: { application/json: { schema: { $ref: '#/components/schemas/Errore' } } }

  /write:
    post:
      summary: Scrive un tag NFC (testo / hex / tessera socio)
      security: [ { ApiKeyAuth: [] } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/WriteRequest' } } }
      responses:
        '200': { description: Esito scrittura, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        '401': { description: API key non valida, content: { application/json: { schema: { $ref: '#/components/schemas/Errore' } } } }

  /verify:
    post:
      summary: Verifica il checksum HMAC di una risposta
      security: [ { ApiKeyAuth: [] } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/VerifyRequest' } } }
      responses:
        '200': { description: Esito verifica, content: { application/json: { schema: { $ref: '#/components/schemas/VerifyResponse' } } } }
        '401': { description: API key non valida, content: { application/json: { schema: { $ref: '#/components/schemas/Errore' } } } }

  /merge:
    post:
      summary: Unisce due letture già fatte (stateless)
      description: Fonde i JSON di due documenti (es. TS-CNS + passaporto) in un'unica identità con verifica di corrispondenza. Il client trasporta entrambe le letture.
      security: [ { ApiKeyAuth: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                documentoA: { type: string, description: JSON della prima lettura }
                documentoB: { type: string, description: JSON della seconda lettura }
      responses:
        '200': { description: Identità unita, content: { application/json: { schema: { $ref: '#/components/schemas/Documento' } } } }
        '401': { description: API key non valida, content: { application/json: { schema: { $ref: '#/components/schemas/Errore' } } } }

  /identity/begin:
    post:
      summary: Flow identità (1/2) — legge la prima carta e apre una sessione
      description: >
        Legge la PRIMA carta (tipicamente la Tessera Sanitaria: codice fiscale certificato, luogo e
        data di nascita) e la tiene in memoria server-side in una sessione con TTL. Stessi parametri
        di /check. Se la lettura fallisce non apre alcuna sessione e ritorna l'errore.
      security: [ { ApiKeyAuth: [] } ]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CheckRequest' }
            examples:
              tsCns: { summary: Tessera Sanitaria, value: { foto: false } }
      responses:
        '200':
          description: Sessione aperta con la prima lettura
          content:
            application/json:
              schema:
                type: object
                properties:
                  session: { type: string }
                  scadeTraSecondi: { type: integer }
                  primaLettura: { $ref: '#/components/schemas/Documento' }
        '401': { description: API key non valida, content: { application/json: { schema: { $ref: '#/components/schemas/Errore' } } } }

  /identity/complete:
    post:
      summary: Flow identità (2/2) — legge la seconda carta e unisce
      description: >
        Legge la SECONDA carta (es. passaporto/CIE) e la unisce alla prima tenuta in `session`. La
        data di nascita per la chiave MRZ, se non passata, viene ripresa dalla prima lettura. La
        sessione si chiude solo se la seconda lettura riesce (così è ripetibile in caso di errore).
      security: [ { ApiKeyAuth: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: '#/components/schemas/CheckRequest' }
                - type: object
                  required: [ session ]
                  properties:
                    session: { type: string, description: id sessione da /identity/begin }
            examples:
              passaporto: { summary: Passaporto come seconda carta, value: { session: "<id>", documentNumber: "YA1234567", dateOfExpiry: "300620", foto: true } }
      responses:
        '200': { description: Identità unita, content: { application/json: { schema: { $ref: '#/components/schemas/Documento' } } } }
        '401': { description: API key non valida, content: { application/json: { schema: { $ref: '#/components/schemas/Errore' } } } }

  /identity/cancel:
    post:
      summary: Flow identità — annulla una sessione aperta
      security: [ { ApiKeyAuth: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ session ]
              properties: { session: { type: string } }
      responses:
        '200':
          description: Esito annullamento
          content: { application/json: { schema: { type: object, properties: { annullata: { type: boolean } } } } }
        '401': { description: API key non valida, content: { application/json: { schema: { $ref: '#/components/schemas/Errore' } } } }

  /openapi.yaml:
    get:
      summary: Questa specifica
      responses:
        '200': { description: OpenAPI, content: { application/yaml: { schema: { type: string } } } }

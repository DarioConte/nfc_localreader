# Configurazione del servizio di verifica identita' (CIE / TS-CNS / passaporto / EMV).
#
# Precedenza (dalla piu' alta): system property -D  >  variabile d'ambiente  >  questo file.
# Questo file e' incluso nel jar come default; per la produzione mettine una copia
# chiamata "identity.properties" ACCANTO al jar (o indica il path con -Dconfig=/percorso).
#
# Avvio facile (Windows e Linux):  java -jar cie-cns-wedge.jar
# (oppure usa run.bat / run.sh, che aggiungono --add-modules java.smartcardio per i JDK piu' vecchi)

# --- Rete ---
# Porta HTTP (ascolta solo su 127.0.0.1)
#port=8765
# Origine CORS consentita (in produzione restringila all'URL del gestionale)
#origin=*

# --- Sicurezza / chiavi (IMPOSTALE in produzione, stabili e condivise tra le istanze) ---
# Chiave API richiesta nell'header X-API-Key (se assente ne viene generata una a ogni avvio)
#apikey=CAMBIA_QUESTA_API_KEY
# Chiave per il checksum HMAC delle risposte (verifica lato gestionale)
#signkey=CAMBIA_QUESTA_SIGN_KEY
# Chiave crittografica per gli identificativi pseudonimi (chiaveAnagrafica, tokenCarta, idDocumento)
# DEVE essere stabile e UGUALE su tutti i tornelli, altrimenti i token cambiano.
#cryptokey=CAMBIA_QUESTA_CRYPTO_KEY

# --- Console di debug ---
# Abilita la pagina di test '/' e i dump "debug" (APDU, PAN in chiaro). In produzione: false.
# Si puo' anche commutare a runtime dall'icona nel system tray.
console.enabled=true

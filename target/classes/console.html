<!doctype html><html lang='it'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Verifica identita'</title><style>body{font-family:system-ui,Arial,sans-serif;max-width:680px;margin:40px auto;padding:0 16px;color:#1a1a1a}h1{font-size:1.3rem}input,button,select{font-size:1rem;padding:.55rem .7rem;border-radius:8px;border:1px solid #ccc}button{background:#1f6feb;color:#fff;border:none;cursor:pointer}button:hover{background:#1759c2}label{display:block;margin:.6rem 0 .2rem;font-weight:600}pre{background:#0d1117;color:#c9d1d9;padding:14px;border-radius:10px;overflow:auto;white-space:pre-wrap}.row{display:flex;gap:.5rem;align-items:end;flex-wrap:wrap}.muted{color:#666;font-size:.9rem}</style></head><body><h1>Verifica identita' da carta</h1><p class='muted'>Pagina di test. In produzione chiama POST /check dal gestionale con header X-API-Key.</p><div class='row'><div><label>Lettore</label><select id='reader'></select></div><button onclick='caricaLettori()' style='background:#444'>Aggiorna lettori</button></div><div class='row'><div><label>API key</label><input id='key' placeholder='X-API-Key'></div><div><label>CAN (CIE / carta francese)</label><input id='can' inputmode='numeric' maxlength='6' placeholder='6 cifre'></div><div><label>Foto</label><label style='font-weight:400'><input type='checkbox' id='foto' checked> includi (DG2)</label></div><div><label>Debug</label><label style='font-weight:400'><input type='checkbox' id='debug'> diagnostica eMRTD</label></div><button onclick='leggi()'>Leggi carta</button><button onclick='stato()' style='background:#444'>Stato</button><button onclick='identifica()' style='background:#6b21a8'>Identifica (preflight)</button></div><fieldset style='border:1px solid #333;border-radius:8px;margin-top:10px'><legend>Passaporto / ID estero (chiave MRZ, lascia il CAN vuoto)</legend><div class='row'><div><label>N. documento</label><input id='p_doc' placeholder='es. YA1234567'></div><div><label>Data nascita</label><input id='p_dob' placeholder='AAMMGG o AAAA-MM-GG'></div><div><label>Data scadenza</label><input id='p_doe' placeholder='AAMMGG o AAAA-MM-GG'></div></div><p class='muted'>Compila questi campi (dalla MRZ del documento) e premi "Leggi carta".</p></fieldset><div class='row'><div><label>Testo da scrivere su tag NFC</label><input id='wtext' placeholder='es. SOCIO-000123'></div><button onclick='scrivi()' style='background:#0a7d33'>Scrivi NFC</button></div><fieldset style='border:1px solid #333;border-radius:8px;margin-top:10px'><legend>Tessera socio (scrittura strutturata)</legend><div class='row'><div><label>Chiave anagrafica</label><input id='s_ka' placeholder='HMAC 64 hex'></div><div><label>Codice socio</label><input id='s_cs' placeholder='es. 000123'></div></div><div class='row'><div><label>Codice familiare</label><input id='s_cf' placeholder='es. 01'></div><div><label>Familiari abilitati al bar (separati da virgola)</label><input id='s_fam' placeholder='es. 01,02,03'></div></div><button onclick='scriviSocio()' style='background:#0a7d33'>Scrivi tessera socio</button></fieldset><label>Foto (DG2)</label><div id='fotobox' class='muted'>—</div><img id='fotoimg' alt='foto CIE' style='display:none;max-width:220px;border-radius:10px;border:1px solid #ccc;margin-top:6px'><label>Risultato</label><pre id='out'>—</pre><script>
function key(){return document.getElementById('key').value;}
function reader(){return document.getElementById('reader').value;}
function q(){const v=reader();return v?('?reader='+encodeURIComponent(v)):'';}
async function caricaLettori(){try{const r=await fetch('/actuator/readers');const j=await r.json();const sel=document.getElementById('reader');sel.innerHTML='';const o0=document.createElement('option');o0.value='';o0.textContent='auto (prima con carta)';sel.appendChild(o0);(j.readers||[]).forEach(rd=>{const o=document.createElement('option');o.value=rd.index;o.textContent='['+rd.index+'] '+rd.name+(rd.cardPresent?'  [carta]':'');sel.appendChild(o);});}catch(e){}}
function mostraFoto(j){const img=document.getElementById('fotoimg'),box=document.getElementById('fotobox');if(j&&j.fotoBase64){img.src=j.fotoBase64;img.style.display='';const jp2=/image\/jp2/i.test(j.fotoBase64);box.textContent=jp2?'Formato JPEG 2000: visibile su Safari; Chrome/Firefox potrebbero non mostrarla.':'';}else{img.removeAttribute('src');img.style.display='none';box.textContent=(j&&j.fotoErrore)?('Foto non letta: '+j.fotoErrore):'Nessuna foto nella risposta.';}}
async function leggi(){const out=document.getElementById('out');out.textContent='Lettura...';mostraFoto(null);const b={can:document.getElementById('can').value.trim(),foto:document.getElementById('foto').checked,debug:document.getElementById('debug').checked};const pd=document.getElementById('p_doc').value.trim();if(pd){b.documentNumber=pd;b.dateOfBirth=document.getElementById('p_dob').value.trim();b.dateOfExpiry=document.getElementById('p_doe').value.trim();}try{const r=await fetch('/check'+q(),{method:'POST',headers:{'Content-Type':'application/json','X-API-Key':key()},body:JSON.stringify(b)});const j=await r.json();out.textContent=JSON.stringify(j,null,2);mostraFoto(j);}catch(e){out.textContent='Errore: '+e;}}
async function scrivi(){const out=document.getElementById('out');out.textContent='Scrittura...';try{const r=await fetch('/write'+q(),{method:'POST',headers:{'Content-Type':'application/json','X-API-Key':key()},body:JSON.stringify({text:document.getElementById('wtext').value})});out.textContent=JSON.stringify(await r.json(),null,2);}catch(e){out.textContent='Errore: '+e;}}
async function scriviSocio(){const out=document.getElementById('out');out.textContent='Scrittura...';const b={chiaveAnagrafica:document.getElementById('s_ka').value.trim(),codiceSocio:document.getElementById('s_cs').value.trim(),codiceFamiliare:document.getElementById('s_cf').value.trim(),familiari:document.getElementById('s_fam').value.trim()};try{const r=await fetch('/write'+q(),{method:'POST',headers:{'Content-Type':'application/json','X-API-Key':key()},body:JSON.stringify(b)});out.textContent=JSON.stringify(await r.json(),null,2);}catch(e){out.textContent='Errore: '+e;}}
async function stato(){const out=document.getElementById('out');try{const r=await fetch('/actuator/status'+q());out.textContent=JSON.stringify(await r.json(),null,2);}catch(e){out.textContent='Errore: '+e;}}
async function identifica(){const out=document.getElementById('out');out.textContent='Identifico...';mostraFoto(null);const sep=q()?'&':'?';try{const r=await fetch('/identify'+q()+sep+'apikey='+encodeURIComponent(key()));out.textContent=JSON.stringify(await r.json(),null,2);}catch(e){out.textContent='Errore: '+e;}}
var P_TXT=['key','can','p_doc','p_dob','p_doe','wtext','s_ka','s_cs','s_cf','s_fam'];
var P_CHK=['foto','debug'];
function ripristina(){P_TXT.forEach(function(id){var el=document.getElementById(id);if(!el)return;var v=localStorage.getItem('cie_'+id);if(v!==null)el.value=v;el.addEventListener('input',function(){localStorage.setItem('cie_'+id,el.value);});});P_CHK.forEach(function(id){var el=document.getElementById(id);if(!el)return;var v=localStorage.getItem('cie_'+id);if(v!==null)el.checked=(v==='true');el.addEventListener('change',function(){localStorage.setItem('cie_'+id,el.checked);});});}
window.addEventListener('load',function(){caricaLettori();ripristina();});
</script></body></html>
